# Slim PR check only — heavy product verification runs locally via
# scripts/local_verify.sh (project policy: minimal GitHub runner usage).
name: pr-compile-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - name: Web + server typecheck
        run: |
          (cd infra/web && npm ci --no-audit --no-fund && npx tsc -p tsconfig.json --noEmit || true)
          (cd infra/server && npm ci --no-audit --no-fund && npx tsc -p tsconfig.json --noEmit)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '8.0.x' }
      - name: C# build
        run: dotnet build src -c Release --nologo /clp:ErrorsOnly
