# OpenCodeReview — AI line-level review on every PR.
#
# Uses the official composite action (alibaba/open-code-review). The LLM is
# OpenRouter (OpenAI-compatible protocol), model z-ai/glm-5.3-flash — the same
# model family the local pre-commit hook uses.
#
# REQUIREMENTS (repo settings):
#   - Secret OPENROUTER_API_KEY — the review provider key.
#   - Variable OCR_ENABLED=true — opt-in gate so keyless forks never see a
#     red review job. Set it once in Settings → Secrets and variables → Actions.
name: OpenCodeReview
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ vars.OCR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          llm_url: https://openrouter.ai/api/v1
          llm_auth_token: ${{ secrets.OPENROUTER_API_KEY }}
          llm_model: z-ai/glm-5.3-flash
          llm_use_anthropic: 'false'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: English
          review_task_timeout: '5'
          sticky_summary: 'true'
          route_severity_below: 'low'
          upload_artifacts: 'true'
