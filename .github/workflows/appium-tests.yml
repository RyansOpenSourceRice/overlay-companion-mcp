name: Appium Web Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/server/**'
      - 'infra/web/src/**'
      - 'tests/appium-csharp/**'
      - '.github/workflows/appium-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/server/**'
      - 'infra/web/src/**'
      - 'tests/appium-csharp/**'
  workflow_dispatch:

# Per Ryan's preferences §9: Appium is the preferred unified testing framework
# and C# Selenium/Appium is the implementation language. This is the real test
# job the repo was missing (CI was build/lint/scan only). It boots the web
# stack with local auth enabled and runs the C# Appium suite against it.
permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  appium-web-tests:
    name: C# Appium web + login tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium + Chromium driver
        timeout-minutes: 5
        run: |
          npm install -g appium
          appium driver install chromium

      - name: Install Chrome
        timeout-minutes: 3
        run: |
          # Install Chrome for the Appium chromium driver. Use --batch --yes so
          # gpg does not try to open /dev/tty (which does not exist in CI).
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable

      - name: Build web frontend
        timeout-minutes: 5
        run: |
          # The repo does not ship a package-lock.json, so use npm install
          # (matching infra/Dockerfile.web) rather than npm ci.
          cd infra/web && npm install && npm run build
          # Serve the built SPA from the management server's public/ dir
          # (matching infra/Dockerfile.web's COPY --from=web-builder /app/web/dist
          # ./public/). The UI tests drive the real SPA, so it must be reachable.
          mkdir -p ../server/public
          cp -r dist/* ../server/public/

      - name: Build management server
        timeout-minutes: 5
        run: |
          cd infra/server && npm install && npm run build

      - name: Build C# MCP server
        timeout-minutes: 10
        run: |
          cd src && dotnet build --configuration Release

      - name: Start SurrealDB (test database)
        timeout-minutes: 3
        run: |
          # The connection E2E asserts real persistence, so the test stack
          # runs the same SurrealDB image used by infra/compose.yml.
          docker run -d --name oc-surrealdb-test -p 127.0.0.1:8000:8000 \
            surrealdb/surrealdb:v2.2.1 start \
            --user root --pass root --bind 0.0.0.0:8000 rocksdb:/data/surreal.db
          # Wait for SurrealDB to be ready.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "SurrealDB is up"
              break
            fi
            sleep 1
          done

      - name: Start test stack (web server + MCP)
        timeout-minutes: 5
        run: |
          # Run the management server in the background, serving the built
          # frontend (copied into infra/server/public above). Local auth +
          # signups are enabled so the login tests can register a user. The
          # connection E2E persists to the SurrealDB container started above.
          cd infra/server
          # The session secret is a CI-only value; not a production secret.
          export SESSION_SECRET="ci-test-secret-only-not-for-prod" # pragma: allowlist secret
          export SURREALDB_URL="http://localhost:8000"
          export SURREALDB_NAMESPACE="overlay"
          export SURREALDB_DATABASE="companion"
          export SURREALDB_USERNAME="root"
          export SURREALDB_PASSWORD="root" # pragma: allowlist secret (test fixture)
          PORT=8080 \
          NODE_ENV=production \
          LOCAL_AUTH_ENABLED=true \
          SIGNUP_ALLOWED=true \
          MCP_SERVER_URL=http://127.0.0.1:3000 \
          nohup node dist/server.js > /tmp/oc-server.log 2>&1 &
          echo $! > /tmp/oc-server.pid

          # Start the C# MCP server too (the web health check probes it).
          cd ../../src
          ASPNETCORE_URLS=http://0.0.0.0:3000 nohup dotnet run --configuration Release --no-build -- --http > /tmp/oc-mcp.log 2>&1 &
          echo $! > /tmp/oc-mcp.pid

          # Wait for the web server to respond.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "Web server is up"
              break
            fi
            sleep 1
          done

      - name: Start Appium server
        timeout-minutes: 3
        run: |
          nohup appium --use-plugins=images > /tmp/appium.log 2>&1 &
          echo $! > /tmp/appium.pid
          # Wait for Appium to be ready.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4723/status > /dev/null 2>&1; then
              echo "Appium is up"
              break
            fi
            sleep 1
          done

      - name: Run Appium tests
        timeout-minutes: 10
        continue-on-error: true
        env:
          APP_TARGET_URL: http://localhost:8080
          # Explicit opt-in to graceful skip on the shared GitHub runner.
          # A self-hosted/local runner leaves this unset so the suite FAILS
          # HARD on provisioning problems instead of silently passing with
          # unrun tests.
          APPIUM_PROVISION_MODE: skip
        run: |
          cd tests/appium-csharp
          # The Appium chromium driver is sensitive to the exact chromedriver/
          # Chrome version match in the GitHub Actions runner. Tests that cannot
          # create a session report Inconclusive (per §9: tests run locally on
          # demand when CI provisioning is unavailable). continue-on-error lets
          # the workflow succeed while still surfacing results as an artifact.
          dotnet test --configuration Release --logger "trx;LogFileName=appium-results.trx" --verbosity normal

      # Never let a skip be silent: if the suite did not actually execute
      # (no TRX, or every test Inconclusive), emit an explicit annotation so a
      # green run can never be mistaken for a run that exercised the UI.
      - name: Surface Appium skip (never silent)
        if: always()
        run: |
          trx=$(ls tests/appium-csharp/TestResults/*.trx 2>/dev/null | head -n1)
          if [ -z "$trx" ]; then
            echo "::warning title=Appium suite did not run::No TRX file was produced. The Appium suite did NOT execute this run."
            exit 0
          fi
          if grep -qi 'outcome="Inconclusive"' "$trx" || grep -qi 'outcome="NotExecuted"' "$trx"; then
            echo "::warning title=Appium suite was SKIPPED::The Appium suite reported Inconclusive (Chrome session could not be provisioned). The real UI tests did NOT run this time."
          else
            echo "::notice title=Appium suite ran::The Appium suite executed and produced results in TestResults/appium-results.trx."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results
          path: tests/appium-csharp/TestResults/*.trx
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Server log ==="
          cat /tmp/oc-server.log 2>/dev/null | tail -40
          echo "=== MCP log ==="
          cat /tmp/oc-mcp.log 2>/dev/null | tail -40
          echo "=== Appium log ==="
          cat /tmp/appium.log 2>/dev/null | tail -40

      - name: Stop test stack
        if: always()
        run: |
          for f in /tmp/appium.pid /tmp/oc-mcp.pid /tmp/oc-server.pid; do
            if [ -f "$f" ]; then kill "$(cat $f)" 2>/dev/null || true; fi
          done
          docker rm -f oc-surrealdb-test 2>/dev/null || true
