[package]
name = "clipboard-bridge"
version = "0.1.0"
edition = "2021"
description = "Rust HTTP service to read/write VM clipboard for Overlay Companion MCP"
license = "GPL-3.0-or-later"
keywords = ["clipboard", "wayland", "x11", "http", "service"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
axum = { version = "0.8.9" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tower = "0.5.3"
tower-http = { version = "0.5", features = ["cors"] }
which = "6.0.3"
thiserror = "1.0.69"
async-process = "2.5.0"
futures-lite = "2.6.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[[bin]]
name = "clipboard-bridge"
path = "src/main.rs"
