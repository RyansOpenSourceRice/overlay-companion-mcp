# Pre-commit configuration for Overlay Companion MCP
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Auto-dependency installation: This configuration automatically installs
# missing dependencies (bandit, pbr, cspell, semgrep) when hooks run

repos:
  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        files: \.py$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: \.py$
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: \.py$
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  # Gitleaks secret scanning (per Ryan's owned-repo standards §29: gitleaks via
  # pre-commit is the single gate for secret detection; no parallel CI/CD-only
  # gitleaks step). Auto-installs gitleaks if missing.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret detection)
        # Install the gitleaks binary release rather than `go install`, because
        # the upstream module path moved (zricethezav → gitleaks org) and
        # `go install github.com/gitleaks/gitleaks/v8@latest` fails with a
        # module-path conflict. The binary release is the supported install
        # path and keeps the §29 single secret gate working.
        entry: >-
          bash -c 'command -v gitleaks >/dev/null 2>&1 || { echo "Installing gitleaks..."; (command -v brew >/dev/null 2>&1 && brew install gitleaks) || { VERSION=8.30.1; curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz && tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks && chmod +x /tmp/gitleaks && sudo mv /tmp/gitleaks /usr/local/bin/gitleaks || echo "WARNING: gitleaks not installed; skipping secret scan. Install: https://github.com/gitleaks/gitleaks/releases"; }; }; gitleaks protect --staged --redact --verbose'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        files: \.(yaml|yml)$
        # Helm chart templates use Go template syntax ({{- ... -}}), which is
        # not valid YAML until rendered. Skip them here; `helm lint` validates.
        exclude: ^infra/helm/.*/templates/
      - id: check-json
        files: \.json$
      - id: check-toml
        files: \.toml$
      - id: check-xml
        files: \.xml$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  # C# formatting (if dotnet-format is available)
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet-format
        entry: bash -c 'command -v dotnet >/dev/null 2>&1 || { echo "dotnet not found, skipping"; exit 0; }; cd src && dotnet format --verbosity minimal'
        language: system
        files: \.(cs|csproj)$
        pass_filenames: false

      # AppImage and build validation
      - id: check-build-scripts-executable
        name: Check build scripts are executable
        entry: bash -c 'for script in scripts/*.sh; do [ -x "$script" ] || { echo "❌ $script is not executable. Run chmod +x $script"; exit 1; }; done'
        language: system
        files: ^scripts/.*\.sh$
        pass_filenames: false

      - id: validate-appimage-if-exists
        name: Validate AppImage if exists
        entry: bash -c 'if ls build/*.AppImage 1> /dev/null 2>&1; then echo "🔍 Found AppImage, running validation..."; ./scripts/validate-appimage.sh build/*.AppImage; else echo "ℹ️  No AppImage found, skipping validation"; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: check-workflow-syntax
        name: Check GitHub Actions workflow syntax
        entry: python3 -c "import yaml, sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: check-npm-cache-config
        name: Check for npm cache configuration issues
        entry: bash -c 'if grep -r "cache.*npm" .github/workflows/ && ! find . -name "package*.json" -type f | grep -q .; then echo "❌ npm cache configured but no package.json found"; exit 1; fi'
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      # Ontology validation + deterministic sorting (rdflib, pure Python).
      # No Jena container, no OpenJDK — runs on any machine with python3.
      # Auto-installs rdflib into a project-local venv on first run.
      - id: ontology-validate-sort
        name: ontology (rdflib validate + sort)
        entry: bash -c 'command -v python3 >/dev/null 2>&1 || { echo "python3 required for ontology hook"; exit 1; }; ./scripts/ontology-validate-sort.sh "$@"' --
        language: system
        files: ^docs/ontology/.*\.ttl$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        files: \.md$
        args: ["--fix"]

  # Spell checking with auto-install
  - repo: local
    hooks:
      - id: cspell-with-install
        name: cspell
        # Prefer repo-local cspell (infra/server/node_modules/.bin/cspell) for reproducibility.
        # Fallback to global install only if local binary not found.
        entry: bash -c 'if [ -x "./infra/server/node_modules/.bin/cspell" ]; then exec ./infra/server/node_modules/.bin/cspell --no-progress "$@"; else command -v cspell >/dev/null 2>&1 || { echo "Installing global cspell..."; npm install -g cspell; }; exec cspell --no-progress "$@"; fi' --
        language: system
        files: \.md$

  # JavaScript/Node.js security scanning (CodeQL-like functionality)
  - repo: local
    hooks:
      - id: eslint-security
        name: ESLint Security Analysis
        # Scan both .js and .ts — the web layer is TypeScript (per the locked
        # architecture decision). The previous .js-only pattern found no files
        # and failed with "No files matching the pattern".
        entry: bash -c 'cd infra/server && npm list eslint-plugin-security >/dev/null 2>&1 || npm install --no-save eslint@8 eslint-plugin-security; npx eslint --ext .js,.ts --config .eslintrc-security.json . --ignore-pattern dist/ --ignore-pattern public/ --ignore-pattern node_modules/'
        language: system
        files: \.(js|ts)$
        pass_filenames: false

      - id: semgrep-security
        name: Semgrep Security Analysis (CodeQL Alternative)
        entry: bash -c 'command -v semgrep >/dev/null 2>&1 || { echo "Installing semgrep..."; pip install semgrep; }; semgrep --config=auto --quiet --exclude="*.min.js" --exclude="node_modules/" --include="*.js" --include="*.ts" --include="*.cs" . || echo "⚠️  Semgrep found security issues - review recommended"'
        language: system
        files: \.(js|ts|cs)$
        pass_filenames: false

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        exclude: \.lock$|\.min\.js$|\.min\.css$

  # Git commit message linting
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, ci]

  # Push-time safety checks to block confusing failure modes
  - repo: local
    hooks:
      - id: no-conflict-markers-push
        name: Block conflict markers on push
        entry: bash -lc 'if git grep -n -E "^(<<<<<<< |=======$|>>>>>>> )" -- . >/dev/null; then echo "Conflict markers found. Resolve before pushing."; exit 1; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: prevent-push-if-unmerged
        name: Block push with unmerged files
        entry: bash -lc 'if [ -n "$(git diff --name-only --diff-filter=U)" ]; then echo "Unmerged files present. Resolve merges first."; exit 1; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false

      - id: prevent-push-if-behind-main
        name: Block push when branch is behind origin/main (use Actions → Rebase Feature Branch)
        entry: bash -lc 'git fetch -q origin main; if ! git merge-base --is-ancestor origin/main HEAD; then echo "Branch is behind origin/main. Use GitHub Actions → Rebase Feature Branch onto main."; exit 1; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
