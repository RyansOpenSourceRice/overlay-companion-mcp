# Traefik static configuration for Overlay Companion MCP (managed mode).
# The management server renders the dynamic TLS config (dynamic-tls.yml) into
# infra/server/certs/ and it is mounted here. Entry points:
#   web  (HTTP, port 80)
#   websecure (HTTPS, port 443)
#
# Operators may pick Traefik instead of Caddy via Settings -> HTTPS &
# Certificates -> Terminator. When TLS_MODE=none, Traefik proxies HTTP only.

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
