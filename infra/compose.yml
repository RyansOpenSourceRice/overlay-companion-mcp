version: '3.9'

x-common-env: &common_env
  TZ: ${TZ:-Etc/UTC}
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  # Production shape: Secure cookies + fail-closed session-secret guard in
  # infra/server/src/auth.ts. For local dev via compose, set NODE_ENV=development.
  NODE_ENV: ${NODE_ENV:-production}
  # Better Auth (in-app auth engine, §7). BETTER_AUTH_SECRET is the session-
  # signing secret; ADMIN_EMAIL grants the admin role on login. No default
  # secret here so a deployment without one is visibly broken, not forgeable.
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
  BETTER_AUTH_PASSKEY_RP_ID: ${BETTER_AUTH_PASSKEY_RP_ID:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  # Session cookie Secure flag. This app is commonly self-hosted over plain
  # HTTP on a LAN, where a Secure cookie would be refused by the browser, so the
  # flag is OFF by default. Set COOKIE_SECURE=true only when serving over HTTPS
  # (directly or behind a TLS-terminating reverse proxy).
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Reverse-proxy hop count/address for rate-limiting IP extraction. Default
  # 'loopback' (no proxy). Behind Caddy/Traefik set TRUST_PROXY to the proxy
  # hop count (e.g. 1). Never spoofable: server refuses 'true'.
  TRUST_PROXY: ${TRUST_PROXY:-loopback}
  # TLS / HTTPS serving (§7). The app stays HTTP behind the terminator (Caddy or
  # Traefik); these control the serving-cert mode and are the bootstrap defaults
  # for the GUI (Settings -> HTTPS & Certificates). ACSME renews automatically;
  # the custom CA's trust anchor lives on client devices.
  TLS_MODE: ${TLS_MODE:-none}            # none | acme-public | acme-private | upload | self-signed
  TLS_TERMINATOR: ${TLS_TERMINATOR:-caddy}  # caddy | traefik
  TLS_MANAGED: ${TLS_MANAGED:-false}     # true = app manages the terminator container
  TLS_REDIRECT_HTTP: ${TLS_REDIRECT_HTTP:-false}
  TLS_ACME_DIRECTORY: ${TLS_ACME_DIRECTORY:-}  # step-ca / private ACME directory URL
  TLS_ACME_ROOT_CA: ${TLS_ACME_ROOT_CA:-}      # PEM trust anchor for the ACME endpoint
  # SurrealDB connection (decoupled service so it can migrate to K3S later).
  # Format: Server=<endpoint>;Namespace=<ns>;Database=<db>;Username=<u>;Password=<p>
  SURREALDB_URL: ${SURREALDB_URL:-http://surrealdb:8000}
  SURREALDB_NAMESPACE: ${SURREALDB_NAMESPACE:-overlay}
  SURREALDB_DATABASE: ${SURREALDB_DATABASE:-companion}
  SURREALDB_USERNAME: ${SURREALDB_USERNAME:-root}
  SURREALDB_PASSWORD: ${SURREALDB_PASSWORD:-root}

services:
  overlay-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    image: overlay-companion/web:latest
    environment:
      <<: *common_env
      MCP_SERVER_URL: http://mcp-server:3000
    ports:
      - "${WEB_PORT:-8082}:8080"
    depends_on:
      - mcp-server
      - surrealdb

  mcp-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp
    image: overlay-companion/mcp-csharp:latest
    environment:
      <<: *common_env
      ASPNETCORE_URLS: http://0.0.0.0:3000
    expose:
      - "3000"
    depends_on:
      - surrealdb

  control-mcp:
    image: overlay-companion/control-mcp:latest
    environment:
      <<: *common_env
      MCP_HTTP_PORT: 3003
    expose:
      - "3003"

  # Bidirectional clipboard (Phase E2/E3). Bridges browser ↔ VM clipboard with
  # X-API-Key auth (fail-fast if unset) and a CORS origin pinned to the web UI.
  clipboard-bridge:
    build:
      context: ..
      dockerfile: infra/Dockerfile.clipboard
    image: overlay-companion/clipboard-bridge:latest
    environment:
      CLIPBOARD_BRIDGE_API_KEY: ${CLIPBOARD_BRIDGE_API_KEY:?CLIPBOARD_BRIDGE_API_KEY must be set}
      CLIPBOARD_BRIDGE_ALLOWED_ORIGIN: ${CLIPBOARD_BRIDGE_ALLOWED_ORIGIN:-http://localhost:8082}
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
    ports:
      - "${CLIPBOARD_BRIDGE_PORT:-8765}:8765"

  # SurrealDB is the only database (per Ryan's preferences §9). Decoupled as a
  # standalone service so it can move to K3S independently. Backs users,
  # sessions, connections, audit log, and app configuration for both the TS
  # management server and the C# MCP server.
  surrealdb:
    image: surrealdb/surrealdb:v2.2.1
    command: ["start", "--user", "${SURREALDB_USERNAME:-root}", "--pass", "${SURREALDB_PASSWORD:-root}", "--bind", "0.0.0.0:8000", "rocksdb:/data/surreal.db"]
    environment:
      SURREAL_LOG_LEVEL: ${SURREAL_LOG_LEVEL:-info}
    volumes:
      - surrealdb-data:/data
      - ./surrealdb/schema:/schema:ro
    ports:
      - "${SURREALDB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    command: ["start-dev", "--http-port=8080", "--hostname-strict=false"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin} # pragma: allowlist secret (dev example)
      # Production: set KEYCLOAK_ADMIN_PASSWORD to a strong secret and enable a
      # production DB. See docs/DEPLOYMENT.md.
    ports:
      - "8085:8080"

  caddy:
    image: caddy:2.8.4
    ports:
      # Fully custom ports so they don't collide with other projects. HTTP on
      # 8080 by default (non-privileged); HTTPS on 8443 by default. Set to 80/443
      # when those are free. HTTPS is served when a TLS mode is active; otherwise
      # Caddy just proxies HTTP.
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Uploaded/generated server cert + ACME root CA + rendered TLS config.
      # Written by the management server (see infra/server/src/tls-manager.ts).
      - ./certs:/certs:ro
    depends_on:
      - overlay-web
      - mcp-server
      - control-mcp
      - keycloak

  # Traefik terminator (managed mode option; see Settings -> HTTPS & Certificates).
  # Uncomment to use Traefik instead of Caddy. The dynamic TLS config is rendered
  # by the management server into infra/server/certs/traefik-dynamic.yml and
  # mounted read-only. Requires the docker provider socket.
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik-static.yml
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_HTTPS_PORT:-8443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-static.yml:/etc/traefik/traefik-static.yml:ro
      - ./server/certs:/etc/traefik/dynamic:ro
    depends_on:
      - overlay-web
      - mcp-server

networks:
  default:
    name: overlay-net

volumes:
  surrealdb-data:
    name: overlay-surrealdb-data
