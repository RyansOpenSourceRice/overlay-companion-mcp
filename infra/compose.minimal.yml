# Overlay Companion MCP — minimal podman/docker compose.
#
# The "solo app container" philosophy (D-017): one app container (the TS
# management server + web frontend, built by infra/Dockerfile.server). The
# database is libSQL (Turso) opened as an embedded file on the `overlay-data`
# volume — no separate DB service. OpenFGA is optional; add the `openfga`
# service from infra/compose.yml and enable it in Settings when you deploy it.
#
# Usage:
#   podman-compose -f infra/compose.minimal.yml up -d --build
#   open http://localhost:8080

x-common-env: &common_env
  NODE_ENV: ${NODE_ENV:-development}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me} # pragma: allowlist secret (dev default)
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:8080}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  # libSQL (Turso) — the only database. Embedded local file by default.
  LIBSQL_URL: ${LIBSQL_URL:-file:/data/companion.db}
  LIBSQL_AUTH_TOKEN: ${LIBSQL_AUTH_TOKEN:-}
  SEED_DEMO: ${SEED_DEMO:-false}
  DEMO_EMAIL: ${DEMO_EMAIL:-demo@overlay.local}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password-1234}
  DEMO_TARGET_ID: ${DEMO_TARGET_ID:-sample}
  DEMO_TARGET_PORT: ${DEMO_TARGET_PORT:-6901}
  DEMO_TARGET_SSL: ${DEMO_TARGET_SSL:-true}
  OPENFGA_ENABLED: ${OPENFGA_ENABLED:-false}
  OPENFGA_URL: ${OPENFGA_URL:-http://openfga:8080}

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    image: overlay-companion/server:latest
    environment:
      <<: *common_env
      HTTP_PORT: 8080
    volumes:
      # libSQL database file (embedded mode).
      - overlay-data:/data
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    ports:
      - "${CADDY_HTTP_PORT:-8081}:80"
    volumes:
      - ./Caddyfile.minimal:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  overlay-data:
    name: overlay-minimal-data
