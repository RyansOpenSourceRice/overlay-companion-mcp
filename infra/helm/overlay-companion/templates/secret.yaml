apiVersion: v1
kind: Secret
metadata:
  name: {{ include "overlay-companion.fullname" . }}
  labels:
    {{- include "overlay-companion.labels" . | nindent 4 }}
type: Opaque
stringData:
  # BETTER_AUTH_SECRET signs sessions. No default: a deployment without one is
  # visibly broken, never forgeable (matches the compose posture).
  BETTER_AUTH_SECRET: {{ .Values.config.betterAuthSecret | quote }}
  {{- if not .Values.surrealdb.enabled }}
  SURREALDB_PASSWORD: {{ .Values.surrealdb.password | quote }}
  {{- end }}
