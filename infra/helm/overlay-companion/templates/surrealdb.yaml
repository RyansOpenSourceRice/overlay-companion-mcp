{{- if .Values.surrealdb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "overlay-companion.fullname" . }}-surrealdb
  labels:
    {{- include "overlay-companion.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "overlay-companion.fullname" . }}-surrealdb
  replicas: 1
  selector:
    matchLabels:
      {{- include "overlay-companion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: surrealdb
  template:
    metadata:
      labels:
        {{- include "overlay-companion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: surrealdb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: surrealdb
          image: {{ .Values.surrealdb.image | quote }}
          args:
            - start
            - --user
            - {{ .Values.surrealdb.username | quote }}
            - --pass
            - {{ .Values.surrealdb.password | quote }}
            - --bind
            - 0.0.0.0:8000
            - rocksdb:/data/surreal.db
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.surrealdb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.surrealdb.storageClass }}
        storageClassName: {{ .Values.surrealdb.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.surrealdb.size }}
{{- end }}
