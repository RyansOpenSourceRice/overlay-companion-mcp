{{- if .Values.openfga.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overlay-companion.fullname" . }}-openfga
  labels:
    {{- include "overlay-companion.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overlay-companion.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: openfga
{{- end }}
