apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overlay-companion.fullname" . }}
  labels:
    {{- include "overlay-companion.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "overlay-companion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "overlay-companion.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "overlay-companion.fullname" . }}
            - secretRef:
                name: {{ include "overlay-companion.fullname" . }}
          env:
            - name: SURREALDB_URL
              value: {{ if .Values.surrealdb.enabled }}http://{{ include "overlay-companion.fullname" . }}-surrealdb:8000{{ else }}{{ .Values.surrealdb.externalUrl | default "http://surrealdb:8000" }}{{ end }}
            - name: OPENFGA_ENABLED
              value: {{ .Values.openfga.enabled | quote }}
            - name: OPENFGA_URL
              value: {{ if .Values.openfga.enabled }}http://{{ include "overlay-companion.fullname" . }}-openfga:8080{{ else }}http://openfga:8080{{ end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
