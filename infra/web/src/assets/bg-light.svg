<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Decorative miniature screens with overlay annotations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- Faint grid dots -->
  <g fill="#94a3b8" opacity="0.25">
    <circle cx="120" cy="120" r="3"/><circle cx="360" cy="200" r="2"/>
    <circle cx="700" cy="100" r="3"/><circle cx="1100" cy="180" r="2"/>
    <circle cx="1300" cy="120" r="3"/><circle cx="90" cy="700" r="2"/>
    <circle cx="520" cy="820" r="3"/><circle cx="900" cy="780" r="2"/>
    <circle cx="1350" cy="760" r="3"/>
  </g>

  <!-- Screen A (top-left) -->
  <g filter="url(#soft)">
    <rect x="140" y="150" width="300" height="200" rx="16" fill="url(#screen1)" stroke="#cbd5e1"/>
    <!-- title bar -->
    <circle cx="168" cy="178" r="5" fill="#ef4444"/><circle cx="186" cy="178" r="5" fill="#f59e0b"/><circle cx="204" cy="178" r="5" fill="#22c55e"/>
    <rect x="150" y="205" width="280" height="120" rx="8" fill="#f1f5f9"/>
    <!-- fake browser nav -->
    <rect x="150" y="195" width="120" height="8" rx="4" fill="#e2e8f0"/>
  </g>
  <!-- annotations on A -->
  <g stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.9">
    <circle cx="260" cy="300" r="18" stroke-dasharray="4 4"/>
    <path d="M260 318 L240 360" marker-end="url(#arrowA)"/>
  </g>
  <defs><marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker></defs>

  <!-- Screen B (top-right) -->
  <g filter="url(#soft)">
    <rect x="980" y="130" width="320" height="215" rx="16" fill="url(#screen1)" stroke="#cbd5e1"/>
    <circle cx="1010" cy="160" r="5" fill="#ef4444"/><circle cx="1028" cy="160" r="5" fill="#f59e0b"/><circle cx="1046" cy="160" r="5" fill="#22c55e"/>
    <rect x="990" y="185" width="300" height="135" rx="8" fill="#f1f5f9"/>
    <!-- grid of mini windows -->
    <rect x="1005" y="200" width="130" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="1145" y="200" width="130" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="1005" y="270" width="130" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="1145" y="270" width="130" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <!-- annotation on B -->
  <g stroke="#2563eb" stroke-width="3" fill="none" opacity="0.9">
    <circle cx="1240" cy="230" r="20" stroke-dasharray="4 4"/>
    <path d="M1240 250 L1215 300" marker-end="url(#arrowB)"/>
  </g>
  <defs><marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>

  <!-- Screen C (bottom-left) -->
  <g filter="url(#soft)">
    <rect x="200" y="560" width="280" height="200" rx="16" fill="url(#screen1)" stroke="#cbd5e1"/>
    <circle cx="228" cy="588" r="5" fill="#ef4444"/><circle cx="246" cy="588" r="5" fill="#f59e0b"/><circle cx="264" cy="588" r="5" fill="#22c55e"/>
    <rect x="210" y="615" width="260" height="120" rx="8" fill="#f1f5f9"/>
    <!-- fake buttons -->
    <rect x="225" y="640" width="90" height="26" rx="6" fill="#2563eb"/>
    <rect x="325" y="640" width="90" height="26" rx="6" fill="#e2e8f0"/>
  </g>
  <!-- annotation on C -->
  <g stroke="#22c55e" stroke-width="3" fill="none" opacity="0.9">
    <circle cx="360" cy="690" r="16" stroke-dasharray="4 4"/>
    <path d="M360 706 L330 740" marker-end="url(#arrowC)"/>
  </g>
  <defs><marker id="arrowC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#22c55e"/></marker></defs>

  <!-- Screen D (bottom-right) -->
  <g filter="url(#soft)">
    <rect x="1000" y="600" width="300" height="180" rx="16" fill="url(#screen1)" stroke="#cbd5e1"/>
    <circle cx="1028" cy="628" r="5" fill="#ef4444"/><circle cx="1046" cy="628" r="5" fill="#f59e0b"/><circle cx="1064" cy="628" r="5" fill="#22c55e"/>
    <rect x="1010" y="655" width="280" height="100" rx="8" fill="#f1f5f9"/>
    <!-- line chart -->
    <polyline points="1030,730 1090,700 1140,720 1200,675 1260,690" fill="none" stroke="#2563eb" stroke-width="3"/>
  </g>
  <!-- annotation on D -->
  <g stroke="#ef4444" stroke-width="3" fill="none" opacity="0.9">
    <circle cx="1200" cy="675" r="15" stroke-dasharray="4 4"/>
    <path d="M1200 660 L1170 630" marker-end="url(#arrowD)"/>
  </g>
  <defs><marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ef4444"/></marker></defs>

  <!-- Floating dots -->
  <g fill="#6366f1" opacity="0.5">
    <circle cx="520" cy="420" r="6"/><circle cx="880" cy="470" r="5"/>
    <circle cx="720" cy="330" r="7"/>
  </g>
</svg>
