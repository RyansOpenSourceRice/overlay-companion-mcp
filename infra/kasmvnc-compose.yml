version: "3.8"
services:
  kasmvnc:
    image: lscr.io/linuxserver/kasm:latest
    container_name: overlay-companion-kasmvnc
    privileged: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - KASM_PORT=443
      - DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME:-}
      - DOCKER_HUB_PASSWORD=${DOCKER_HUB_PASSWORD:-}
      - DOCKER_MTU=1500
    volumes:
      - kasmvnc_data:/opt
      - kasmvnc_profiles:/profiles
      - /dev/input:/dev/input:ro
      - /run/udev/data:/run/udev/data:ro
    ports:
      - "${KASMVNC_PORT:-6080}:6901"   # KasmVNC web interface (mapped to 6080 by default)
      - "${KASMVNC_ADMIN_PORT:-3000}:3000"  # Admin interface
    restart: unless-stopped
    networks:
      - overlay-network

  mcp-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp
    container_name: overlay-companion-mcp
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:3000
      KASMVNC_URL: http://kasmvnc:6901
    ports:
      - "${MCP_PORT:-3001}:3000"
    depends_on:
      - kasmvnc
    restart: unless-stopped
    networks:
      - overlay-network

  overlay-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: overlay-companion-web
    environment:
      PORT: 8080
      MCP_SERVER_URL: http://mcp-server:3000
      KASMVNC_URL: http://kasmvnc:6901
    ports:
      - "${WEB_PORT:-8082}:8080"
    depends_on:
      - mcp-server
      - kasmvnc
    restart: unless-stopped
    networks:
      - overlay-network

  # Bidirectional clipboard (Phase E2/E3). The viewer bridges the browser
  # clipboard to the VM's clipboard through this service. Requires a strong
  # CLIPBOARD_BRIDGE_API_KEY (fail-fast if absent); CORS is pinned to the web
  # origin. /dev/input + udev mounts stay on the kasmvnc service; this bridge
  # only needs xclip/wl-clipboard inside the VM session it reads.
  clipboard-bridge:
    build:
      context: ..
      dockerfile: infra/Dockerfile.clipboard
    container_name: overlay-companion-clipboard
    environment:
      CLIPBOARD_BRIDGE_API_KEY: ${CLIPBOARD_BRIDGE_API_KEY:?CLIPBOARD_BRIDGE_API_KEY must be set}
      CLIPBOARD_BRIDGE_ALLOWED_ORIGIN: ${CLIPBOARD_BRIDGE_ALLOWED_ORIGIN:-http://localhost:8080}
      DISPLAY: ${DISPLAY:-}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
    ports:
      - "${CLIPBOARD_BRIDGE_PORT:-8765}:8765"
    restart: unless-stopped
    networks:
      - overlay-network

  # Simplified Caddy proxy - fewer services to route
  caddy:
    image: docker.io/library/caddy:2.8.4
    container_name: overlay-companion-proxy
    ports:
      - "${CONTAINER_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.kasmvnc:/etc/caddy/Caddyfile:ro
    depends_on:
      - mcp-server
      - overlay-web
      - kasmvnc
    restart: unless-stopped
    networks:
      - overlay-network

volumes:
  kasmvnc_data:
  kasmvnc_profiles:

networks:
  overlay-network:
    driver: bridge
